name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The steps `pnpm precommit` runs, spelled out so a failure names itself
      # in the UI. Keep them in sync with that script in package.json, which
      # the pre-commit hook runs as one command.
      - run: pnpm lint

      - run: pnpm format:check
        if: ${{ !cancelled() }}

      - run: pnpm typecheck
        if: ${{ !cancelled() }}

      - run: pnpm knip
        if: ${{ !cancelled() }}

      - run: pnpm test
        if: ${{ !cancelled() }}

  a11y:
    name: Accessibility
    runs-on: ubuntu-latest
    # The pages under test render Clerk's hosted components, so the build needs
    # the publishable key. Without it the job would test a setup notice.
    if: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY != '' }}
    env:
      VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:a11y

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
